<!DOCTYPE html>
<html lang="en">
<!--
  A simple digital clock that displays the current time and date.
  The time is formatted as "HH:MM AM/PM" and the date is formatted as "day - mmm dd, yyyy".
  The clock updates every second to ensure it always shows the current time.

  open -na "Google Chrome" --args --app="file://~/src/tries/2026-02-17-clock-html/index.html"
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .clock-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 60px 80px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time {
            font-size: 96px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .date {
            font-size: 28px;
            font-weight: 400;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="time" id="time">00:00 AM</div>
        <div class="date" id="date">Loading...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // Format time as HH:MM AM/PM
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12

            const timeString = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')} ${ampm}`;

            // Format date as "day - mmm dd, yyyy"
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const day = now.getDate();
            const year = now.getFullYear();

            const dateString = `${dayName} - ${monthName} ${String(day).padStart(2, '0')}, ${year}`;

            // Update the DOM
            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // Update immediately and then every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
